<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFM Touch 数据分析入口</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f7f8fa; }
    .wrap { max-width:820px; padding:32px; text-align:center; }
    h1 { font-size:24px; margin:0 0 6px; }
    .sub { color:#888; font-size:13px; margin-bottom:28px; }
    .cards { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    @media (max-width:640px){ .cards{ grid-template-columns:1fr; } }
    a.card { display:block; padding:26px 22px; border:1px solid #e3e6ea; border-radius:12px;
             background:#fff; text-decoration:none; color:#1a1a1a; transition:.18s; text-align:left; }
    a.card:hover { border-color:#3b82f6; box-shadow:0 6px 20px rgba(59,130,246,.15); transform:translateY(-2px); }
    .card .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px;
                 background:#eef5ff; color:#084298; margin-bottom:10px; }
    .card .tag.amber { background:#fff8e6; color:#7a5b00; }
    .card h2 { font-size:17px; margin:0 0 8px; }
    .card p { font-size:12.5px; color:#666; line-height:1.6; margin:0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>DFM Touch 数据分析</h1>
    <div class="sub">请选择分析模式</div>
    <div class="cards">
      <a class="card" href="index_dfm_log.html">
        <span class="tag">DFM 模式</span>
        <h2>1. DFM 模式佩戴数据分析</h2>
        <p>解析串口 / BLE 日志中的 <code>$DFM,TP</code> 行，绘制 diff0 / diff1 / base0 / base1 四合一波形，支持 4 字段与 8 字段格式。</p>
      </a>
      <a class="card" href="index_offline_log.html">
        <span class="tag amber">App 模式</span>
        <h2>2. App 模式佩戴数据分析</h2>
        <p>解析 <code>app_wear</code> 日志行，按 mask 触发帧绘制四通道轨迹，支持时间轴缩放 / 平移与右键菜单。</p>
      </a>
    </div>
  </div>
</body>
</html>
